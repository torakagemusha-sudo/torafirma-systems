name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test
        run: pytest -q
      - name: Audit
        run: python -m zpa_lm_reference.audit --limit 96 --compact
      - name: Tiny overfit smoke
        if: matrix.python-version == '3.12'
        run: python examples/tiny_overfit.py --steps 80 --max-final-loss 0.35
