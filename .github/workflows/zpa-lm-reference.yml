name: ZPA-LM reference conformance

on:
  push:
    paths:
      - "zpa-lm-reference/**"
      - ".github/workflows/zpa-lm-reference.yml"
  pull_request:
    paths:
      - "zpa-lm-reference/**"
      - ".github/workflows/zpa-lm-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zpa-lm-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: zpa-lm-reference

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: zpa-lm-reference/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Dependency consistency
        run: python -m pip check

      - name: Compile
        run: python -m compileall -q src tests examples

      - name: Test
        run: pytest -q

      - name: Audit
        run: python -m zpa_lm_reference.audit --limit 96 --compact

      - name: Tiny overfit smoke
        if: matrix.python-version == '3.12'
        run: python examples/tiny_overfit.py --steps 80 --max-final-loss 0.35
