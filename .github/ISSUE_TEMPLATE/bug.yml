name: Bug in reference implementation
description: Report a defect in published code or scripts (not a research disagreement).
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - ZPA-LM Reference
        - Arithmetic Clock tools
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
